apiVersion: scheduling.volcano.sh/v1beta1
kind: Queue
metadata:
  name: exp-queue-gang
spec:
  # 故意不设 capability：proportion 插件见到 realCapability == nil 会直接 Permit，
  # 从而让 Job 顺利通过 enqueue 这道门，把失败点推到 allocate/gang。
  weight: 1
---
apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: exp-gang
spec:
  # 3 节点 × 10 CPU = 30 CPU 总量；每 task 8 CPU ⇒ 最多放得下 3 个。
  # minAvailable=4 ⇒ gang 永远凑不齐 ⇒ allocate 必须放弃整组。
  minAvailable: 4
  schedulerName: volcano
  queue: exp-queue-gang
  tasks:
    - replicas: 4
      name: worker
      template:
        spec:
          containers:
            - name: worker
              image: busybox:1.36
              command: ["sh", "-c", "echo gang-path-should-never-run && sleep 60"]
              resources:
                requests:
                  cpu: 8
                  memory: 128Mi
              imagePullPolicy: IfNotPresent
          restartPolicy: Never
